<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tank Battle 1v1</title>
  <style>
    body { margin: 0; display: grid; place-items: center; height: 100vh; background: #111; font-family: system-ui, Arial; }
    canvas { background: #2a3d2a; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
    .wrap { position: relative; }
    .overlay{
      position:absolute; inset:0; display:none; align-items:center; justify-content:center;
      flex-direction:column; gap:12px; color:#fff;
      background: rgba(0,0,0,.55); border-radius: 12px;
    }
    .overlay.show { display:flex; }
    button { padding: 10px 18px; font-weight: 700; cursor: pointer; border:0; border-radius:8px; background:#3498DB; color:#fff; font-size:14px; }
    button:hover { background:#2980B9; }
    .hud{
      position:absolute; left:0; right:0; top:10px; display:flex; justify-content:space-between;
      padding: 0 14px; font: 13px system-ui, Arial; color:#fff; pointer-events:none;
      text-shadow: 0 1px 2px rgba(0,0,0,.6);
    }
    .player { background: rgba(0,0,0,.35); padding:6px 10px; border-radius:8px; }
    .p1 { border-left: 4px solid #3498DB; }
    .p2 { border-left: 4px solid #E74C3C; }
    .controls {
      position:absolute; left:0; right:0; bottom:8px; text-align:center;
      font: 11px system-ui, Arial; color: rgba(255,255,255,.7);
      pointer-events:none; text-shadow: 0 1px 2px rgba(0,0,0,.6);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="c" width="900" height="600"></canvas>
    <div class="hud">
      <div class="player p1" id="hud1">P1 (WASD + Space) ❤❤❤</div>
      <div class="player p2" id="hud2">P2 (Arrows + Enter) ❤❤❤</div>
    </div>
    <div class="controls">P1: WASD bewegen, SPACE schieten &nbsp;|&nbsp; P2: Pijltjes bewegen, ENTER schieten</div>
    <div id="ov" class="overlay">
      <div id="winText" style="font-size:32px;font-weight:800;"></div>
      <button id="again">Play Again</button>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const ov = document.getElementById("ov");
  const winText = document.getElementById("winText");
  const again = document.getElementById("again");
  const hud1 = document.getElementById("hud1");
  const hud2 = document.getElementById("hud2");

  const W = canvas.width, H = canvas.height;
  const DT = 1/60;

  // Tank settings
  const TANK_SIZE = 28;
  const TANK_SPEED = 140;
  const TANK_ROT_SPEED = 3.2;          // radians/sec
  const BULLET_SPEED = 360;
  const BULLET_R = 4;
  const BULLET_LIFE = 3.0;             // seconds
  const BULLET_MAX_BOUNCES = 1;
  const FIRE_COOLDOWN = 0.55;          // seconds between shots
  const RAPID_FIRE_COOLDOWN = 0.18;
  const SPEED_MULT = 1.7;
  const POWERUP_DURATION = 6;          // seconds
  const POWERUP_SPAWN_MIN = 4;
  const POWERUP_SPAWN_MAX = 9;
  const MAX_HP = 3;

  const keys = new Set();
  window.addEventListener("keydown", (e) => {
    keys.add(e.key);
    if ([" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Enter"].includes(e.key)) e.preventDefault();
    if (gameOver && (e.key === "Enter" || e.key === " ")) reset();
  }, { passive: false });
  window.addEventListener("keyup", (e) => keys.delete(e.key));

  function rand(a,b){ return Math.random()*(b-a) + a; }
  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
  function aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // Walls (static obstacles)
  let walls;
  function buildWalls() {
    walls = [
      // outer border (implicit via canvas edges, but add inner walls)
      // center cross
      { x: W/2 - 60, y: H/2 - 8,  w: 120, h: 16 },
      { x: W/2 - 8,  y: H/2 - 60, w: 16,  h: 120 },
      // corners
      { x: 120, y: 110, w: 16, h: 120 },
      { x: W - 136, y: 110, w: 16, h: 120 },
      { x: 120, y: H - 230, w: 16, h: 120 },
      { x: W - 136, y: H - 230, w: 16, h: 120 },
      // small blocks
      { x: 220, y: 80, w: 80, h: 16 },
      { x: W - 300, y: 80, w: 80, h: 16 },
      { x: 220, y: H - 96, w: 80, h: 16 },
      { x: W - 300, y: H - 96, w: 80, h: 16 },
    ];
  }

  // Tanks
  let p1, p2;
  function makeTank(x, y, angle, color, controls) {
    return {
      x, y, angle,
      color,
      controls,                // {up, down, left, right, fire}
      hp: MAX_HP,
      cooldown: 0,
      // powerup effects
      speedUntil: 0,
      rapidUntil: 0,
      shieldUntil: 0,
    };
  }

  // Bullets
  let bullets;

  // Powerups: types speed, rapid, shield
  let powerups;
  let nextPowerupAt;
  let t;

  let gameOver;

  function reset() {
    ov.classList.remove("show");
    gameOver = false;
    t = 0;

    buildWalls();

    p1 = makeTank(80, H/2, 0, "#3498DB", {
      up: "w", down: "s", left: "a", right: "d", fire: " "
    });
    p2 = makeTank(W - 80, H/2, Math.PI, "#E74C3C", {
      up: "ArrowUp", down: "ArrowDown", left: "ArrowLeft", right: "ArrowRight", fire: "Enter"
    });

    bullets = [];
    powerups = [];
    scheduleNextPowerup();
    updateHUD();
  }

  function scheduleNextPowerup() {
    nextPowerupAt = t + rand(POWERUP_SPAWN_MIN, POWERUP_SPAWN_MAX);
  }

  function spawnPowerup() {
    const types = ["speed", "rapid", "shield"];
    const type = types[Math.floor(Math.random()*types.length)];
    // Find free spot
    for (let tries = 0; tries < 30; tries++) {
      const x = rand(40, W - 40);
      const y = rand(40, H - 40);
      const box = { x: x-14, y: y-14, w: 28, h: 28 };
      let ok = true;
      for (const w of walls) if (aabb(box, w)) { ok = false; break; }
      if (ok) {
        powerups.push({ x, y, type, r: 14, bob: rand(0, Math.PI*2) });
        return;
      }
    }
  }

  function tankRect(tank) {
    return { x: tank.x - TANK_SIZE/2, y: tank.y - TANK_SIZE/2, w: TANK_SIZE, h: TANK_SIZE };
  }

  function tryMoveTank(tank, dx, dy) {
    // Move in X then Y, blocking on wall collision
    let nx = tank.x + dx;
    let ny = tank.y + dy;

    // X
    let rect = { x: nx - TANK_SIZE/2, y: tank.y - TANK_SIZE/2, w: TANK_SIZE, h: TANK_SIZE };
    if (rect.x < 0 || rect.x + rect.w > W) nx = tank.x;
    else {
      let blocked = false;
      for (const w of walls) if (aabb(rect, w)) { blocked = true; break; }
      if (blocked) nx = tank.x;
    }

    // Y
    rect = { x: nx - TANK_SIZE/2, y: ny - TANK_SIZE/2, w: TANK_SIZE, h: TANK_SIZE };
    if (rect.y < 0 || rect.y + rect.h > H) ny = tank.y;
    else {
      let blocked = false;
      for (const w of walls) if (aabb(rect, w)) { blocked = true; break; }
      if (blocked) ny = tank.y;
    }

    // Tank vs tank collision
    const otherRect = tankRect(tank === p1 ? p2 : p1);
    const finalRect = { x: nx - TANK_SIZE/2, y: ny - TANK_SIZE/2, w: TANK_SIZE, h: TANK_SIZE };
    if (aabb(finalRect, otherRect)) { nx = tank.x; ny = tank.y; }

    tank.x = nx; tank.y = ny;
  }

  function updateTank(tank) {
    const c = tank.controls;
    // rotation: left/right
    if (keys.has(c.left))  tank.angle -= TANK_ROT_SPEED * DT;
    if (keys.has(c.right)) tank.angle += TANK_ROT_SPEED * DT;

    // forward/backward
    let speed = TANK_SPEED;
    if (t < tank.speedUntil) speed *= SPEED_MULT;
    let move = 0;
    if (keys.has(c.up)) move += 1;
    if (keys.has(c.down)) move -= 0.6;
    if (move !== 0) {
      const dx = Math.cos(tank.angle) * speed * move * DT;
      const dy = Math.sin(tank.angle) * speed * move * DT;
      tryMoveTank(tank, dx, dy);
    }

    // shooting
    tank.cooldown -= DT;
    const cdNeeded = (t < tank.rapidUntil) ? RAPID_FIRE_COOLDOWN : FIRE_COOLDOWN;
    if (keys.has(c.fire) && tank.cooldown <= 0) {
      tank.cooldown = cdNeeded;
      const muzzleDist = TANK_SIZE/2 + 8;
      const bx = tank.x + Math.cos(tank.angle) * muzzleDist;
      const by = tank.y + Math.sin(tank.angle) * muzzleDist;
      bullets.push({
        x: bx, y: by,
        vx: Math.cos(tank.angle) * BULLET_SPEED,
        vy: Math.sin(tank.angle) * BULLET_SPEED,
        owner: tank,
        life: BULLET_LIFE,
        bounces: 0,
      });
    }
  }

  function updateBullets() {
    for (const b of bullets) {
      b.life -= DT;
      let nx = b.x + b.vx * DT;
      let ny = b.y + b.vy * DT;

      // bounce off canvas edges
      if (nx - BULLET_R < 0 || nx + BULLET_R > W) {
        if (b.bounces >= BULLET_MAX_BOUNCES) { b.life = 0; continue; }
        b.vx = -b.vx; b.bounces++;
        nx = b.x + b.vx * DT;
      }
      if (ny - BULLET_R < 0 || ny + BULLET_R > H) {
        if (b.bounces >= BULLET_MAX_BOUNCES) { b.life = 0; continue; }
        b.vy = -b.vy; b.bounces++;
        ny = b.y + b.vy * DT;
      }

      // bounce off walls
      const br = { x: nx - BULLET_R, y: ny - BULLET_R, w: BULLET_R*2, h: BULLET_R*2 };
      for (const w of walls) {
        if (aabb(br, w)) {
          if (b.bounces >= BULLET_MAX_BOUNCES) { b.life = 0; break; }
          // figure out which side: use previous position
          const prevX = b.x, prevY = b.y;
          const fromLeft  = prevX + BULLET_R <= w.x;
          const fromRight = prevX - BULLET_R >= w.x + w.w;
          const fromTop   = prevY + BULLET_R <= w.y;
          const fromBot   = prevY - BULLET_R >= w.y + w.h;
          if (fromLeft || fromRight) { b.vx = -b.vx; nx = b.x + b.vx * DT; }
          else if (fromTop || fromBot) { b.vy = -b.vy; ny = b.y + b.vy * DT; }
          else { b.vx = -b.vx; b.vy = -b.vy; nx = b.x + b.vx * DT; ny = b.y + b.vy * DT; }
          b.bounces++;
          break;
        }
      }

      b.x = nx; b.y = ny;

      // hit tanks
      for (const tank of [p1, p2]) {
        if (tank.hp <= 0) continue;
        const rect = tankRect(tank);
        if (aabb({x: b.x-BULLET_R, y: b.y-BULLET_R, w: BULLET_R*2, h: BULLET_R*2}, rect)) {
          // can't hit yourself in first 0.1s (bullet just spawned in front of you, but just in case)
          if (b.owner === tank && b.life > BULLET_LIFE - 0.1) continue;
          if (t < tank.shieldUntil) {
            // shield blocks, bullet dies
            b.life = 0;
          } else {
            tank.hp -= 1;
            b.life = 0;
            if (tank.hp <= 0) endGame(tank === p1 ? "P2" : "P1");
          }
          break;
        }
      }
    }
    bullets = bullets.filter(b => b.life > 0);
  }

  function updatePowerups() {
    if (t >= nextPowerupAt && powerups.length < 3) {
      spawnPowerup();
      scheduleNextPowerup();
    }

    // pickup
    for (const pu of powerups) {
      for (const tank of [p1, p2]) {
        const dx = tank.x - pu.x, dy = tank.y - pu.y;
        if (Math.hypot(dx, dy) < TANK_SIZE/2 + pu.r) {
          applyPowerup(tank, pu.type);
          pu.dead = true;
          break;
        }
      }
    }
    powerups = powerups.filter(p => !p.dead);
  }

  function applyPowerup(tank, type) {
    if (type === "speed") tank.speedUntil = t + POWERUP_DURATION;
    if (type === "rapid") tank.rapidUntil = t + POWERUP_DURATION;
    if (type === "shield") tank.shieldUntil = t + POWERUP_DURATION;
  }

  function endGame(winner) {
    gameOver = true;
    winText.textContent = `${winner} WINS! 🏆`;
    winText.style.color = winner === "P1" ? "#5DADE2" : "#EC7063";
    ov.classList.add("show");
  }

  function updateHUD() {
    const h1 = "❤".repeat(p1.hp) + "🖤".repeat(MAX_HP - p1.hp);
    const h2 = "❤".repeat(p2.hp) + "🖤".repeat(MAX_HP - p2.hp);
    const pu1 = activeIcons(p1);
    const pu2 = activeIcons(p2);
    hud1.innerHTML = `P1 (WASD + Space) ${h1} ${pu1}`;
    hud2.innerHTML = `P2 (Arrows + Enter) ${h2} ${pu2}`;
  }

  function activeIcons(tank) {
    let s = "";
    if (t < tank.speedUntil)  s += " ⚡";
    if (t < tank.rapidUntil)  s += " 🔫";
    if (t < tank.shieldUntil) s += " 🛡";
    return s;
  }

  again.addEventListener("click", reset);

  function update() {
    if (gameOver) return;
    t += DT;
    updateTank(p1);
    updateTank(p2);
    updateBullets();
    updatePowerups();
    updateHUD();
  }

  // -- Drawing --
  function drawWalls() {
    for (const w of walls) {
      ctx.fillStyle = "#4a3526";
      ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.strokeStyle = "#2e2014";
      ctx.lineWidth = 2;
      ctx.strokeRect(w.x, w.y, w.w, w.h);
    }
  }

  function drawTank(tank) {
    if (tank.hp <= 0) return;
    ctx.save();
    ctx.translate(tank.x, tank.y);
    ctx.rotate(tank.angle);

    // body
    ctx.fillStyle = tank.color;
    ctx.fillRect(-TANK_SIZE/2, -TANK_SIZE/2, TANK_SIZE, TANK_SIZE);
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.strokeRect(-TANK_SIZE/2, -TANK_SIZE/2, TANK_SIZE, TANK_SIZE);

    // tracks
    ctx.fillStyle = "#222";
    ctx.fillRect(-TANK_SIZE/2, -TANK_SIZE/2 - 3, TANK_SIZE, 4);
    ctx.fillRect(-TANK_SIZE/2, TANK_SIZE/2 - 1, TANK_SIZE, 4);

    // turret
    ctx.fillStyle = "#333";
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, Math.PI*2);
    ctx.fill();

    // barrel
    ctx.fillStyle = "#222";
    ctx.fillRect(0, -3, TANK_SIZE/2 + 8, 6);

    ctx.restore();

    // shield aura
    if (t < tank.shieldUntil) {
      ctx.strokeStyle = "rgba(120, 200, 255, 0.8)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(tank.x, tank.y, TANK_SIZE/2 + 6 + Math.sin(t*8)*1.5, 0, Math.PI*2);
      ctx.stroke();
    }
  }

  function drawBullets() {
    for (const b of bullets) {
      ctx.fillStyle = "#FFD93D";
      ctx.beginPath();
      ctx.arc(b.x, b.y, BULLET_R, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  function drawPowerups() {
    for (const pu of powerups) {
      const bob = Math.sin(t*3 + pu.bob) * 2;
      const colorMap = { speed: "#F1C40F", rapid: "#E67E22", shield: "#5DADE2" };
      const iconMap  = { speed: "⚡",     rapid: "🔫",     shield: "🛡" };
      ctx.fillStyle = colorMap[pu.type];
      ctx.beginPath();
      ctx.arc(pu.x, pu.y + bob, pu.r, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.font = "16px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(iconMap[pu.type], pu.x, pu.y + bob + 1);
    }
  }

  function draw() {
    // background grid
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#2a3d2a";
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(0,0,0,0.08)";
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    drawWalls();
    drawPowerups();
    drawBullets();
    drawTank(p1);
    drawTank(p2);
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  reset();
  loop();
})();
</script>
</body>
</html>
